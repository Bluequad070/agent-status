name: Agent status twice-check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Twice-check every endpoint
        env:
          PAUSE_SECONDS: "45"
          # Optional. Add a repo secret named INDEX_TXT_URL to let the Action read
          # chat agents' log lines from the Project Index. Unset = step skipped.
          INDEX_TXT_URL: ${{ secrets.INDEX_TXT_URL }}
        run: python3 scripts/check_action.py

      - name: Commit results
        run: |
          git config user.name "agent-status-action"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json status/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Action: twice-check results $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
