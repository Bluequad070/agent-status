name: Agent status twice-check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Google auth (for reading the private Index)
        run: python3 -m pip install --quiet google-auth==2.35.0 requests==2.32.3

      - name: Twice-check every endpoint
        env:
          PAUSE_SECONDS: "45"
          # The Project Index, read view-only by a Google service account whose JSON
          # key is the repo secret GOOGLE_SA_KEY. No secret = Index step skipped.
          INDEX_DOC_ID: "1ixs_09BNHTAcWwR85UY4jOgPEEj2FbcjttUb6Kpt0_s"
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python3 scripts/check_action.py

      - name: Commit results
        run: |
          git config user.name "agent-status-action"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json status/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Action: twice-check results $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
