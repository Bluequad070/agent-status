<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070b14">
  <title>THE AGENT BAND — Art by Vincent</title>
  <style>
    :root {
      --bg: #070b14;
      --title: #fff8ee;
      --sub: #f0d4a0;
      --claude: #ffb24a;
      --chatgpt: #3ee0a0;
      --gemini: #7aa2ff;
      --gemini2: #b56bff;
      --grok-a: #ff4d6d;
      --grok-b: #3de0ff;
      --tempo: 1.85s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--title);
      font-family: "Avenir Next", Avenir, "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      cursor: default;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    }

    .ambience {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .spot {
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
      will-change: transform, opacity;
    }

    .spot-warm {
      width: 70vw;
      height: 70vw;
      left: -18vw;
      top: -22vw;
      background: radial-gradient(circle, rgba(255, 170, 70, 0.22) 0%, rgba(255, 120, 40, 0.05) 42%, transparent 70%);
      animation: drift-a 16s ease-in-out infinite alternate;
    }

    .spot-cool {
      width: 65vw;
      height: 65vw;
      right: -16vw;
      top: -18vw;
      background: radial-gradient(circle, rgba(90, 150, 255, 0.20) 0%, rgba(140, 80, 255, 0.08) 45%, transparent 70%);
      animation: drift-b 18s ease-in-out infinite alternate;
    }

    .spot-center {
      width: 80vw;
      height: 50vh;
      left: 10vw;
      bottom: -16vh;
      background: radial-gradient(ellipse at center, rgba(180, 90, 255, 0.12) 0%, rgba(255, 80, 100, 0.06) 40%, transparent 70%);
      animation: drift-c 14s ease-in-out infinite alternate;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 40%, rgba(0, 0, 0, 0.45) 100%),
        linear-gradient(to top, rgba(0, 0, 0, 0.55) 0%, transparent 32%);
    }

    .floor {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 4%;
      height: 18%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
      filter: blur(10px);
    }

    @keyframes drift-a {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(6vw, 4vh) scale(1.08); }
    }
    @keyframes drift-b {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(-5vw, 3vh) scale(1.06); }
    }
    @keyframes drift-c {
      from { transform: translateX(0) scale(1); }
      to { transform: translateX(-3vw) scale(1.05); }
    }

    header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: clamp(1.2rem, 3.6vh, 2.6rem) 1.5rem 0.4rem;
      flex: 0 0 auto;
    }

    h1 {
      font-weight: 800;
      letter-spacing: 0.18em;
      font-size: clamp(1.55rem, 5.2vw, 4.15rem);
      line-height: 1.05;
      color: var(--title);
      text-shadow:
        0 0 18px rgba(255, 220, 160, 0.35),
        0 0 48px rgba(255, 180, 80, 0.28),
        0 4px 24px rgba(0, 0, 0, 0.65);
    }

    .subtitle {
      margin-top: clamp(0.35rem, 1.2vh, 0.75rem);
      font-weight: 600;
      font-size: clamp(0.72rem, 1.7vw, 1.2rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--sub);
      text-shadow:
        0 0 16px rgba(240, 200, 130, 0.55),
        0 0 36px rgba(240, 170, 80, 0.25);
    }

    .band {
      position: relative;
      z-index: 2;
      flex: 1 1 auto;
      width: 100%;
      max-width: 1680px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(0.8rem, 2.8vw, 3.2rem);
      padding: 1vh 4vw 6vh;
    }

    .member {
      position: relative;
      flex: 1 1 0;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .halo {
      position: absolute;
      width: 92%;
      height: 34%;
      left: 4%;
      bottom: 6%;
      border-radius: 50%;
      filter: blur(6px);
      opacity: 0.95;
      pointer-events: none;
      z-index: 0;
      animation: halo-pulse var(--tempo) ease-in-out infinite;
      will-change: transform, opacity;
    }

    .member.claude .halo {
      background: radial-gradient(ellipse, rgba(255, 178, 74, 0.7) 0%, rgba(255, 140, 40, 0.25) 45%, transparent 72%);
    }
    .member.chatgpt .halo {
      background: radial-gradient(ellipse, rgba(62, 224, 160, 0.7) 0%, rgba(30, 160, 110, 0.25) 45%, transparent 72%);
    }
    .member.gemini .halo {
      background: radial-gradient(ellipse, rgba(140, 120, 255, 0.72) 0%, rgba(70, 140, 255, 0.28) 45%, transparent 72%);
    }
    .member.grok .halo {
      background: radial-gradient(ellipse, rgba(255, 77, 109, 0.55) 0%, rgba(61, 224, 255, 0.32) 50%, transparent 72%);
    }

    .dancer {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      will-change: transform;
      animation: groove var(--tempo) cubic-bezier(0.45, 0.05, 0.25, 1) infinite;
      transform-origin: 50% 70%;
    }

    .member.claude .dancer { animation-delay: 0s; animation-duration: calc(var(--tempo) * 1.00); }
    .member.chatgpt .dancer { animation-delay: -0.22s; animation-duration: calc(var(--tempo) * 1.08); }
    .member.gemini .dancer { animation-delay: -0.44s; animation-duration: calc(var(--tempo) * 0.94); }
    .member.grok .dancer { animation-delay: -0.66s; animation-duration: calc(var(--tempo) * 1.14); }

    .member.claude .halo { animation-delay: 0s; }
    .member.chatgpt .halo { animation-delay: -0.22s; }
    .member.gemini .halo { animation-delay: -0.44s; }
    .member.grok .halo { animation-delay: -0.66s; }

    .card {
      width: min(22vw, 38vh, 320px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.18),
        0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .member.claude .card {
      box-shadow:
        0 0 0 3px rgba(255, 210, 140, 0.45),
        0 0 22px rgba(255, 178, 74, 0.55),
        0 0 56px rgba(255, 150, 40, 0.32),
        0 14px 32px rgba(0, 0, 0, 0.5);
    }
    .member.chatgpt .card {
      box-shadow:
        0 0 0 3px rgba(170, 255, 220, 0.4),
        0 0 22px rgba(62, 224, 160, 0.55),
        0 0 56px rgba(30, 180, 120, 0.3),
        0 14px 32px rgba(0, 0, 0, 0.5);
    }
    .member.gemini .card {
      box-shadow:
        0 0 0 3px rgba(190, 200, 255, 0.45),
        0 0 22px rgba(140, 120, 255, 0.55),
        0 0 56px rgba(80, 140, 255, 0.32),
        0 14px 32px rgba(0, 0, 0, 0.5);
    }
    .member.grok .card {
      box-shadow:
        0 0 0 3px rgba(255, 180, 200, 0.35),
        0 0 18px rgba(255, 77, 109, 0.5),
        0 0 48px rgba(61, 224, 255, 0.32),
        0 14px 32px rgba(0, 0, 0, 0.5);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #fff;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .name {
      margin-top: clamp(0.55rem, 1.8vh, 1rem);
      font-weight: 700;
      font-size: clamp(0.72rem, 1.55vw, 1.15rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
    }

    .member.claude .name { color: #ffd59a; text-shadow: 0 0 16px rgba(255, 178, 74, 0.7); }
    .member.chatgpt .name { color: #b6ffd9; text-shadow: 0 0 16px rgba(62, 224, 160, 0.7); }
    .member.gemini .name { color: #d0c8ff; text-shadow: 0 0 16px rgba(140, 120, 255, 0.7); }
    .member.grok .name { color: #ffc1cc; text-shadow: 0 0 12px rgba(255, 77, 109, 0.6), 0 0 22px rgba(61, 224, 255, 0.35); }

    @keyframes groove {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1, 1); }
      12% { transform: translate3d(0, -11px, 0) rotate(-2.3deg) scale(1.035, 0.965); }
      24% { transform: translate3d(0, 2px, 0) rotate(1.6deg) scale(0.975, 1.03); }
      40% { transform: translate3d(0, -16px, 0) rotate(2.6deg) scale(1.045, 0.955); }
      56% { transform: translate3d(0, 1px, 0) rotate(-1.4deg) scale(0.985, 1.02); }
      72% { transform: translate3d(0, -9px, 0) rotate(1.8deg) scale(1.02, 0.98); }
      86% { transform: translate3d(0, 3px, 0) rotate(-0.8deg) scale(0.99, 1.015); }
    }

    @keyframes halo-pulse {
      0%, 100% { transform: scale(0.92, 0.85); opacity: 0.7; }
      50% { transform: scale(1.12, 1.05); opacity: 1; }
    }

    body.party { --tempo: 0.95s; }

    body.party .dancer {
      animation-name: groove-party;
    }

    @keyframes groove-party {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1, 1); }
      14% { transform: translate3d(0, -18px, 0) rotate(-4.2deg) scale(1.06, 0.93); }
      28% { transform: translate3d(0, 4px, 0) rotate(3.4deg) scale(0.95, 1.06); }
      46% { transform: translate3d(0, -22px, 0) rotate(4.6deg) scale(1.07, 0.92); }
      62% { transform: translate3d(0, 3px, 0) rotate(-2.8deg) scale(0.96, 1.05); }
      78% { transform: translate3d(0, -14px, 0) rotate(3.2deg) scale(1.04, 0.96); }
      90% { transform: translate3d(0, 5px, 0) rotate(-1.6deg) scale(0.98, 1.03); }
    }

    .controls {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      right: max(12px, env(safe-area-inset-right, 12px));
      z-index: 10;
      display: flex;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    body.show-controls .controls,
    .controls:hover,
    .controls:focus-within {
      opacity: 1;
      pointer-events: auto;
    }

    .controls button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(10, 14, 24, 0.55);
      color: rgba(255, 245, 230, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 0.4rem 0.75rem;
      font: 600 0.72rem/1 "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      min-width: 44px;
      min-height: 32px;
    }

    .controls button:hover,
    .controls button:focus-visible {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(20, 28, 44, 0.75);
      outline: none;
    }

    #fs-btn { font-size: 0.95rem; letter-spacing: 0; padding: 0.3rem 0.65rem; }

    @media (orientation: portrait) and (max-width: 900px) {
      body { overflow: auto; }
      .band {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-content: center;
        gap: 4.5vw 5vw;
        padding: 2vh 6vw 8vh;
        max-width: 720px;
      }
      .card { width: min(38vw, 34vh, 280px); }
      h1 { letter-spacing: 0.12em; }
      .subtitle { letter-spacing: 0.28em; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      header { padding-top: 0.7rem; padding-bottom: 0; }
      h1 { font-size: clamp(1.2rem, 4.4vw, 2.4rem); }
      .subtitle { font-size: 0.7rem; margin-top: 0.2rem; }
      .band { padding-bottom: 3vh; }
      .name { margin-top: 0.35rem; font-size: 0.7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dancer, .halo, .spot { animation: none !important; }
    }
  </style>
</head>

    <div class="spot spot-warm"></div>
    <div class="spot spot-cool"></div>
    <div class="spot spot-center"></div>
    <div class="floor"></div>
    <div class="vignette"></div>
  </div>

      <h2 class="name">Grok</h2>
    </article>
  </main>

  <div class="controls" id="controls">
    <button type="button" id="groove-btn" aria-label="Toggle groove mode">Chill</button>
    <button type="button" id="fs-btn" aria-label="Toggle fullscreen">⛶</button>
  </div>

  <script>
    (function () {
      var hideTimer = null;
      var party = false;
      var grooveBtn = document.getElementById("groove-btn");
      var fsBtn = document.getElementById("fs-btn");

      function poke() {
        document.body.classList.add("show-controls");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
          document.body.classList.remove("show-controls");
        }, 4000);
      }

      ["mousemove", "pointerdown", "pointermove", "touchstart", "keydown"].forEach(function (evt) {
        window.addEventListener(evt, poke, { passive: true });
      });
      poke();

      grooveBtn.addEventListener("click", function () {
        party = !party;
        document.body.classList.toggle("party", party);
        grooveBtn.textContent = party ? "Party" : "Chill";
        poke();
      });

      function isFs() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function requestFs() {
        var el = document.documentElement;
        var fn = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fn) fn.call(el);
      }

      function exitFs() {
        var fn = document.exitFullscreen || document.webkitExitFullscreen;
        if (fn) fn.call(document);
      }

      fsBtn.addEventListener("click", function () {
        if (isFs()) exitFs();
        else requestFs();
        poke();
      });
    })();
  </script>
