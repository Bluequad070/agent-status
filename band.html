<!doctype html>
<html lang="en" data-look="studio"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis Team</title>
<meta name="color-scheme" content="light dark">
<script>try{if(localStorage.getItem("jarvis-look")==="band")document.documentElement.dataset.look="band"}catch(e){}</script>
<style>
:root{
  --page:#eef1f5;--surface:#fff;--surface-2:#f1f3f6;--line:#dde2e8;--fg:#16191d;--muted:#5d6670;
  --accent:#2f6fde;--accent-soft:#e3ecfb;--work:#2f6fde;--ok:#1d8a52;--ok-soft:#e1f3e8;--idle:#8a939c;--off:#b4bac1;
  --me:#2f6fde;--me-fg:#fff;--radius:14px;--shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0f1114;--surface:#1b1f24;--surface-2:#22272d;--line:#2e343b;--fg:#eef1f4;--muted:#9aa4ae;
  --accent:#6b9cf0;--accent-soft:#1f2d45;--work:#6b9cf0;--ok:#4cc386;--ok-soft:#173326;--idle:#6f7882;--off:#4a5159;
  --me:#3b6ee0;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0f1114;--surface:#1b1f24;--surface-2:#22272d;--line:#2e343b;--fg:#eef1f4;--muted:#9aa4ae;
  --accent:#6b9cf0;--accent-soft:#1f2d45;--work:#6b9cf0;--ok:#4cc386;--ok-soft:#173326;--idle:#6f7882;--off:#4a5159;
  --me:#3b6ee0;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
/* Band look: the original dark, playful page. */
:root[data-look="band"]{
  --page:#1d1838;--surface:rgba(0,0,0,.25);--surface-2:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--fg:#fff;--muted:rgba(255,255,255,.7);
  --accent:#ff7a59;--accent-soft:rgba(255,122,89,.18);--work:#ffb27a;--ok:#5fe0a6;--ok-soft:rgba(95,224,166,.16);--idle:#b7aedb;--off:#6d6590;
  --me:#3b6ef5;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
:root[data-look="band"] body{background:radial-gradient(120% 90% at 20% 0%,#5a3f9a 0%,transparent 55%),linear-gradient(135deg,#2b2350,#0f2a3a);background-attachment:fixed}
.wrap{max-width:820px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.mark{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle,var(--accent) 0 30%,transparent 31%),conic-gradient(var(--accent),var(--accent-soft),var(--accent))}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.summary{margin:2px 0 0;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.summary b{color:var(--fg);font-weight:600}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
:root[data-look="band"] .seg button[aria-pressed="true"]{background:var(--accent);color:#1d1933}
.card{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);padding:6px 0;margin-bottom:18px}
:root[data-look="studio"] .card{border-color:transparent;box-shadow:var(--shadow)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 18px 6px}
.head h2{font-size:15px;font-weight:700;margin:0}
.head small{color:var(--muted);font-size:12px}
/* Team list */
.mate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px}
.mate+.mate{border-top:1px solid var(--line)}
.av{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em}
.av .rg{position:absolute;inset:-5px;border-radius:50%;border:2.5px solid transparent}
.mate[data-state="working"] .rg{border-color:var(--work);border-right-color:transparent;animation:spin 1s linear infinite}
.mate[data-state="ready"] .rg{border-color:var(--ok)}
.mate[data-state="offline"] .av{filter:grayscale(1);opacity:.45}
.mate h3{font-size:15px;font-weight:700;margin:0}
.task{margin:3px 0 0;font-size:14px;line-height:1.4;color:var(--fg);overflow-wrap:anywhere}
.seen{margin:3px 0 0;font-size:12px;color:var(--muted)}
.st{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.working{color:var(--work);background:var(--accent-soft)}
.st.working::before{animation:blink 1.2s ease-in-out infinite}
.st.ready{color:var(--ok);background:var(--ok-soft)}
.st.free{color:var(--muted);background:var(--surface-2)}
.st.offline{color:var(--muted);background:transparent;border:1px dashed var(--line)}
@keyframes blink{50%{opacity:.3}}
@media (max-width:520px){.mate{grid-template-columns:auto minmax(0,1fr)}.mate .st{grid-column:2;justify-self:start}}
/* Chat */
.feed{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:8px 18px 14px}
.cm{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.cm .mini{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
.cm .bub{background:var(--surface-2);border-radius:16px 16px 16px 5px;padding:7px 12px;font-size:14px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.cm .who{display:flex;gap:8px;align-items:baseline;font-size:12px;margin-bottom:1px}
.cm .who b{font-weight:700}
.cm time{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.cm.me{align-self:flex-end}
.cm.me .bub{background:var(--me);color:var(--me-fg);border-radius:16px 16px 5px 16px}
.cm.me time{color:rgba(255,255,255,.75)}
.empty{color:var(--muted);font-size:14px}
.foot{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
.foot a{color:var(--accent)}
/* Look switching */
#bandview{display:none}
:root[data-look="band"] #bandview{display:block}
:root[data-look="band"] #teamview{display:none}
@media (prefers-reduced-motion:reduce){.rg,.st::before{animation:none!important}}
.sub{color:var(--muted);margin:0 0 1rem}
.stage{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,.9fr);gap:12px 10px;align-items:end}
.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.crew{min-width:0;max-width:100%;justify-self:stretch}
.crew .fig{width:100%;max-width:100%;min-width:0}
.crew .fig svg{width:100%;height:auto;max-width:100%;display:block}
@media (max-width:560px){
  .stage{grid-template-columns:1fr}
  .band{grid-template-columns:repeat(2,minmax(0,1fr))}
  .crew{max-width:160px;margin:0 auto}
}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 18px}
.bar button,.bar select{font:inherit;font-size:14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;padding:8px 12px;cursor:pointer}
.bar button.primary{background:#fff;color:#1b1a24;font-weight:600}
.cap-line{min-height:1.6em;margin-top:14px;font-weight:600}

/* The band strip. Transparent page; the Mac app gives it a 150px window on the right edge. */
:root{--strip:rgba(20,18,32,.62);--bad:#e5484d;--duck:1}

.fig{position:relative;flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .35s ease,opacity .35s;cursor:pointer}
.fig svg{height:100%;max-height:96px;width:auto;overflow:visible}
.cap{font-size:10px;line-height:1.15;opacity:.85;white-space:nowrap;text-align:center}
.cap small{display:block;opacity:.7;font-size:9px}
.hidebtn{position:absolute;top:2px;left:4px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;
  font-size:12px;line-height:18px;padding:0;cursor:pointer;opacity:0;transition:opacity .2s}
.fig:hover .hidebtn{opacity:1}
.note{display:none;margin-top:3px;max-width:118px;background:#fff;color:#1b1a24;font-size:10px;line-height:1.25;padding:4px 7px;
  border-radius:8px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.fig[data-state="ready"] .note{display:block}
.fig[data-state="disconnected"][data-agent="gemini"] .note{display:block;font-style:italic}

.char,.inst,.gag,.mouth,.lid,.zz{transform-box:fill-box;transform-origin:50% 100%}
.gag,.lid{display:none}
/* idle: still tapping along, very quietly */
.fig[data-state="idle"]{opacity:.7}
.fig[data-state="idle"] .char{animation:nod 1.6s ease-in-out infinite}
.fig[data-state="idle"] .inst{animation:tapalong .8s ease-in-out infinite}
@keyframes nod{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1.2px) rotate(-1.2deg)}}
@keyframes tapalong{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(1px) rotate(.8deg)}}
.fig[data-state="working"] .char{animation:bob .32s ease-in-out infinite alternate}
.fig[data-state="working"] .inst{animation:jig .16s linear infinite alternate}
.fig[data-state="speaking"] .char{animation:bob 1.2s ease-in-out infinite alternate}
.fig[data-state="speaking"] .inst{opacity:calc(.25 + .5 * (1 - var(--duck)))}
.fig[data-state="speaking"] .mouth{animation:talk .22s steps(2) infinite}
.fig[data-state="ready"]{transform:translateX(-6px)}
.fig[data-state="ready"] .char{animation:hop .7s cubic-bezier(.3,1.6,.5,1) infinite}
.fig[data-state="ready"] svg{filter:drop-shadow(0 0 8px rgba(255,255,255,.55))}
.fig[data-state="disconnected"] .gag,.fig[data-state="disconnected"] .lid{display:inline}
.fig[data-state="disconnected"] .eye{display:none}
.fig[data-agent="grok"][data-state="disconnected"] .char{transform:rotate(22deg) translate(6px,10px)}
.fig[data-agent="grok"][data-state="disconnected"] .zz{animation:float 2.4s ease-in infinite}
.fig[data-agent="grok"][data-state="disconnected"] .cymbal{animation:wobble 3s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.fig[data-agent="claude"][data-state="disconnected"] .char{transform:rotate(-8deg)}
.fig[data-agent="claude"][data-state="disconnected"] .spark{animation:spark 1.6s steps(1) infinite}
.fig[data-agent="chatgpt"][data-state="disconnected"] .inst{opacity:0;transition:opacity 1.2s 1s}
.fig[data-agent="chatgpt"][data-state="disconnected"] .char{animation:strum .25s ease-in-out infinite alternate}
.fig[data-agent="chatgpt"][data-state="disconnected"] .huh{animation:appear 3s steps(1) infinite}
.fig[data-agent="gemini"][data-state="disconnected"] .inst{animation:tap .9s ease-in-out infinite}
.fig[data-agent="gemini"][data-state="disconnected"] .lid{display:none}
.fig[data-agent="gemini"][data-state="disconnected"] .eye{display:inline}
.fig[data-agent="claude-code"][data-state="disconnected"] .ball{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.fig[data-agent="codex"][data-state="disconnected"] .ring{animation:smoke 2.4s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.fig[data-agent="gazlowe"][data-state="disconnected"] .char{transform:rotate(6deg)}
.fig[data-agent="gazlowe"][data-state="disconnected"] .lamp{animation:spark 1.2s steps(1) infinite}
.fig[data-state="disconnected"]{opacity:.85}
.fig.shake{animation:shake .6s ease}
@keyframes breathe{50%{transform:scale(1.04,.97)}}
@keyframes bob{to{transform:translateY(-4px) rotate(-3deg)}}
@keyframes jig{to{transform:rotate(4deg)}}
@keyframes talk{50%{transform:scaleY(2.2)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px) scale(1.03,.97)}}
@keyframes float{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-14px)}}
@keyframes wobble{0%{transform:rotate(14deg)}20%{transform:rotate(-10deg)}40%{transform:rotate(6deg)}60%,100%{transform:rotate(0)}}
@keyframes spark{0%,100%{opacity:0}10%{opacity:1}20%{opacity:0}}
@keyframes strum{to{transform:rotate(6deg) translateY(-2px)}}
@keyframes appear{0%,40%{opacity:0}41%,100%{opacity:1}}
@keyframes tap{0%,100%{transform:translateY(0)}20%{transform:translateY(-3px)}40%{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:.9}100%{opacity:0;transform:translateY(-16px) scale(1.5)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px) rotate(-6deg)}40%{transform:translateX(5px) rotate(6deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* Minimal mode */
.dotline{display:none;width:12px;flex:1 1 auto;max-height:46px;border-radius:6px;background:#77758a;position:relative}
.minimal .fig svg{display:none}
.minimal .fig .dotline{display:block}
.minimal .fig{transform:none!important;animation:none!important;opacity:1}
.minimal .fig[data-state="idle"] .dotline{opacity:.6}
.minimal .fig[data-state="working"] .dotline{background:var(--work)}
.minimal .fig[data-state="speaking"] .dotline{background:var(--work);opacity:.4}
.minimal .fig[data-state="ready"] .dotline{background:var(--ok);box-shadow:0 0 0 3px rgba(34,181,115,.35)}
.minimal .fig[data-state="disconnected"] .dotline{background:var(--bad)}
.minimal .fig[data-state="disconnected"] .dotline:after{content:"×";position:absolute;inset:0;font-size:12px;text-align:center;line-height:1}
.minimal .fig[data-state="disconnected"][data-agent="gemini"] .note{display:none}
@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}

.fig{flex:none;height:auto;padding-top:4px}
.fig svg{max-height:none;width:100%;height:auto}
.fig[data-state="idle"]{opacity:1} .fig[data-state="idle"] svg{opacity:.72}
.fig[data-state="disconnected"]{opacity:1} .fig[data-state="disconnected"] svg{opacity:.85}
.cap{font-size:14px;font-weight:600} .cap small{font-size:12px;font-weight:400}
.note{font-size:12px;max-width:none}
.hidebtn,.dotline{display:none!important}
.band{padding-top:84px;row-gap:96px}
.crew{padding-top:84px}
/* Speech bubble above the member's head; figures stay on one baseline. */
.say{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);width:max-content;max-width:min(220px,96%);
  background:#fff;color:#1b1a24;font-size:12.5px;line-height:1.3;padding:7px 10px;border-radius:12px;text-align:left;
  box-shadow:0 8px 22px rgba(0,0,0,.35);z-index:3;
  animation:pop .25s ease-out}
.fig .tail{position:absolute;left:50%;bottom:calc(100% - 4px);width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);z-index:2}
.say i{font-style:normal;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%);opacity:1}}
</style></head>
<body><div class="wrap">
<header class="top">
  <div class="mark"><div class="logo" aria-hidden="true"></div><div><h1>Jarvis</h1><p class="summary" id="summary" aria-live="polite">Checking in…</p></div></div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Look">
    <button type="button" data-look="studio">Studio</button>
    <button type="button" data-look="band">Band</button>
  </div>
</header>

<section class="card" id="teamview" aria-labelledby="teamhead">
  <div class="head"><h2 id="teamhead">Team</h2><small>Right now</small></div>
  <div id="team"></div>
</section>

<section id="bandview" aria-label="Band">
  <p class="sub">AI agents as a band, with Gazlowe on crew. Tap a figure to open its chat.</p>
  <div class="stage">
    <div class="band" id="strip"></div>
    <aside class="crew" id="crewstrip" aria-label="Crew"></aside>
  </div>
  <div class="cap-line" id="caption" aria-live="polite"></div>
  <div class="bar">
    <button class="primary" id="demo" type="button">Play the demo</button>
    <label>Genre <select id="genre"></select></label>
    <button id="sound" type="button" aria-pressed="false">Chimes off</button>
  </div>
</section>

<section class="card" aria-labelledby="chathead">
  <div class="head"><h2 id="chathead">Team chat</h2><small id="chatnote">Read-only</small></div>
  <div class="feed" id="chatlog"><p class="empty">No messages yet.</p></div>
</section>

<p class="foot">Live from the <a href="./">status board</a>. Checks every 45 seconds. A "working" with no update for 2 hours counts as free; no check-in for 24 hours is offline.</p>
</div>
<script>

const AGENTS=[
  {id:"grok",name:"Grok",color:"#d9d9e3",dark:"#4a4a5c",glow:"#ffffff",eyes:"slash",role:0},
  {id:"claude",name:"Claude",color:"#e08a68",dark:"#8a3f22",glow:"#ffb48f",eyes:"arc",role:1},
  {id:"chatgpt",name:"ChatGPT",color:"#3cc49b",dark:"#11674e",glow:"#7dffd6",eyes:"dot",role:2},
  {id:"gemini",name:"Gemini",color:"#7f9bff",dark:"#2c3f9e",glow:"#c7d3ff",eyes:"star",role:3,tap:"is this thing on?"},
  {id:"claude-code",name:"Claude Code",color:"#e08a68",dark:"#8a3f22",glow:"#ffb48f",eyes:"prompt",role:1,acc:"keyboard"},
  {id:"codex",name:"Codex",color:"#3cc49b",dark:"#11674e",glow:"#7dffd6",eyes:"prompt",role:2,acc:"iron"},
  {id:"gazlowe",name:"Gazlowe",color:"#c5d63a",dark:"#4a5a12",glow:"#f4ff8c",eyes:"plus",crew:true}
];
const EYES={
  slash:'<path d="M38 55 l5 -6 M56 55 l5 -6"/>',
  arc:'<path d="M37 54 q4 -5 8 0 M55 54 q4 -5 8 0"/>',
  dot:'<path d="M41 51 h0.1 M59 51 h0.1" stroke-width="6"/>',
  star:'<path d="M41 47 v8 M37 51 h8 M59 47 v8 M55 51 h8"/>',
  prompt:'<path d="M37 47 l5 4 l-5 4 M50 56 h12"/>',
  plus:'<path d="M38 48 h8 M42 44 v8 M56 48 h8 M60 44 v8"/>'
};
const GENRES={
  "Rock":[["drum kit","kit"],["electric bass","bass"],["electric guitar","guitar"],["lead vocals","mic"]],
  "Jazz":[["brushed kit","kit"],["upright bass","upright"],["saxophone","horn"],["jazz vocals","mic"]],
  "Classical":[["timpani","timp"],["cello","upright"],["violin","violin"],["soprano","mic"]],
  "Hip-Hop/Rap":[["turntables","pads"],["808 bass synth","keys"],["keys","keys"],["rapper","mic"]],
  "Country":[["drum kit","kit"],["upright bass","upright"],["banjo","banjo"],["vocals","mic","cowboy"]],
  "Electronic":[["drum pads","pads"],["bass synth","keys"],["synth","keys"],["headset vocals","mic"]],
  "R&B/Soul":[["drum kit","kit"],["electric bass","bass"],["electric piano","keys"],["soul vocals","mic"]],
  "Latin":[["congas","timp"],["bass guitar","bass"],["Spanish guitar","guitar"],["vocals + maracas","mic"]],
  "Metal":[["double-kick kit","kit"],["5-string bass","bass"],["flying-V guitar","guitar"],["screaming vocals","mic"]],
  "Blues":[["drum kit","kit"],["upright bass","upright"],["slide guitar","guitar"],["vocals + harmonica","mic"]],
  "Reggae":[["one-drop kit","kit"],["bass guitar","bass"],["skank guitar","guitar"],["vocals","mic"]],
  "Holiday":[["sleigh bells","bells"],["tuba","horn"],["glockenspiel","keys"],["carols","mic","santa"]]
};
// Apple Music genre tag -> band genre. Unknown falls back to Rock.
function bandGenre(tag){
  const t=(tag||"").toLowerCase();
  const rules=[["holiday","Holiday"],["christmas","Holiday"],["jazz","Jazz"],["classical","Classical"],["soundtrack","Classical"],["score","Classical"],
    ["hip","Hip-Hop/Rap"],["rap","Hip-Hop/Rap"],["country","Country"],["electronic","Electronic"],["dance","Electronic"],["house","Electronic"],
    ["r&b","R&B/Soul"],["soul","R&B/Soul"],["latin","Latin"],["metal","Metal"],["hard rock","Metal"],["blues","Blues"],["reggae","Reggae"]];
  for(const [k,g] of rules) if(t.includes(k)) return g;
  return "Rock";
}
function inst(fam){
  const s='stroke="#1b1a24" stroke-width="1.5"';
  switch(fam){

    const t=TEAM_OF[m.id], c=t?t.color:"#8a939c", ini=t?t.ini:esc(String(m.name||"?").slice(0,2).toUpperCase());
    return `<div class="cm"><div class="mini" style="background:${c}" aria-hidden="true">${ini}</div><div class="bub"><div class="who"><b style="color:color-mix(in srgb,${c} 72%,var(--fg))">${esc(m.name||m.id)}</b><time>${esc(when(m.time))}</time></div>${esc(m.text)}</div></div>`;
  }).join(""):'<p class="empty">No messages yet.</p>';
  log.scrollTop=log.scrollHeight;
}
vocab(); setInterval(renderTeam,30000);
renderTeam(); render(); poll(); setInterval(poll,45000); pollChat(); setInterval(pollChat,30000);
</script></body></html>
