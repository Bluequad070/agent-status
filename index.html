<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Status</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; --card:#f6f6f6;
          --bad:#c62828; --badbg:#fdecea; --btn:#1a1a1a; --btnfg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --muted:#9a9a9a; --line:#2c2c2c; --card:#1c1c1c;
            --bad:#ff6b6b; --badbg:#3a1414; --btn:#eee; --btnfg:#121212; } }
  * { box-sizing:border-box; }
  body { margin:0 auto; max-width:640px; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.4 -apple-system, system-ui, sans-serif; }
  .hero { text-align:center; padding:18px 0 14px; }
  .big { font-size:64px; line-height:1; }
  .hero h1 { font-size:18px; margin:10px 0 2px; }
  .hero p { margin:0; color:var(--muted); font-size:13px; }
  .bar { display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; margin:6px 0 16px; }
  button { font:inherit; font-weight:600; padding:10px 18px; border-radius:10px; border:0;
           background:var(--btn); color:var(--btnfg); cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  label { color:var(--muted); font-size:13px; }
  details { border-top:1px solid var(--line); }
  details:last-of-type { border-bottom:1px solid var(--line); }
  summary { list-style:none; display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:12px 4px; cursor:pointer; }
  summary::-webkit-details-marker { display:none; }
  .name { font-weight:600; }
  .light { grid-row:span 2; align-self:center; font-size:22px; }
  .sub { color:var(--muted); font-size:13px; }
  details.bad summary .sub { color:var(--bad); }
  .more { background:var(--card); border-radius:10px; margin:0 4px 12px; padding:10px 12px; font-size:13px; }
  .more div { margin:2px 0; overflow-wrap:anywhere; }
  .more b { font-weight:600; }
  footer { color:var(--muted); font-size:12px; margin-top:18px; text-align:center; }
  code { font-size:12px; }
</style>
</head>
<body>
<div class="hero">
  <div class="big" id="big">⚪</div>
  <h1 id="bigLabel">Pending</h1>
  <p id="phase">Not checked yet</p>
</div>
<div class="bar">
  <button id="recheck">Recheck now</button>
  <label><input type="checkbox" id="auto" checked> Recheck every 10 min</label>
</div>
<div id="rows"></div>
<footer>
  <div id="action">GitHub Action: loading last verdict…</div>
  <div>Times in America/Chicago · tap a row for details</div>
</footer>
<script src="check.js"></script>
<script>
  var C = window.AgentCheck;
  var state = {};     // id -> {first, second, state, history[]}
  var running = false;
  var autoTimer = null;

  function central(iso, withDate) {
    var d = new Date(iso);
    if (!iso || isNaN(d)) return "never";
    var o = { timeZone: "America/Chicago", hour: "numeric", minute: "2-digit", timeZoneName: "short" };
    if (withDate) { o.month = "short"; o.day = "numeric"; }
    return d.toLocaleString("en-US", o);
  }
  function ago(iso) {
    var t = Date.parse(iso);
    if (!iso || isNaN(t)) return "never seen";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    var txt = m < 1 ? "just now" : m < 60 ? m + "m ago" : m < 2880 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago";
    return "last seen " + txt + " (" + central(iso, true) + ")";
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    var rows = document.getElementById("rows");
    var open = {};
    rows.querySelectorAll("details[open]").forEach(function (d) { open[d.dataset.id] = true; });
    rows.innerHTML = "";
    var states = [];
    C.AGENTS.forEach(function (a) {
      var st = state[a.id] || {};
      var s = st.state || "pending";
      states.push(s);
      var last = st.second || st.first;
      var status = last && last.status;
      var d = el("details");
      d.dataset.id = a.id;
      if (open[a.id]) d.open = true;
      if (s === "x" || s === "red" || s === "flapping") d.className = "bad";
      var sum = el("summary");
      sum.appendChild(el("span", "name", a.name));
      var light = el("span", "light", C.LOOK[s].icon);
      light.title = C.LOOK[s].label;
      sum.appendChild(light);
      var line = !last ? "checking…" :
        (status ? ago(status.last_seen) : last.reasons[0]) +
        (status && status.current_project && status.current_project !== "none" ? " · " + status.current_project : "");
      sum.appendChild(el("span", "sub", line));
      d.appendChild(sum);

      var more = el("div", "more");
      function row(k, v) { var r = el("div"); r.appendChild(el("b", null, k + ": ")); r.appendChild(document.createTextNode(v)); more.appendChild(r); }
      row("State", C.LOOK[s].label);
      if (st.first) row("Check one", st.first.ok ? "pass" : "fail: " + st.first.reasons.join("; "));
      if (st.second) row("Check two", st.second.ok ? "pass" : "fail: " + st.second.reasons.join("; "));
      if (status) {
        row("Surface", status.surface || a.surface);
        row("Writer", status.writer || "");
        row("Last seen (UTC)", status.last_seen || "never");
        row("Last session log", status.last_session_log_date || "none");
        row("Handoff", (status.handoff_authority || "") + (status.handoff_doc ? " · " + status.handoff_doc : ""));
        (status.checks || []).forEach(function (c) { row("Self-check " + c.id, (c.ok ? "ok" : "not ok") + " at " + central(c.at, true)); });
        if (status.note) row("Note", status.note);
      }
      d.appendChild(more);
      rows.appendChild(d);
    });
    var big = C.overall(states);
    document.getElementById("big").textContent = C.LOOK[big].icon;
    document.getElementById("bigLabel").textContent =
      big === "double-green" ? "All agents confirmed" : C.LOOK[big].label;
  }

  function setPhase(t) { document.getElementById("phase").textContent = t; }

  function runCheck() {
    if (running) return;
    running = true;
    var btn = document.getElementById("recheck");
    btn.disabled = true;
    C.AGENTS.forEach(function (a) {
      var prev = state[a.id] || {};
      state[a.id] = { history: prev.history || [] };
    });
    render();
    setPhase("Check one running…");
    Promise.all(C.AGENTS.map(function (a) { return C.checkOnce(a.id); })).then(function (firsts) {
      C.AGENTS.forEach(function (a, i) {
        state[a.id].first = firsts[i];
        state[a.id].state = C.combine(firsts[i], null);
      });
      render();
      var left = C.RULES.pauseSeconds;
      setPhase("Recheck in " + left + "s");
      var t = setInterval(function () {
        left -= 1;
        if (left > 0) { setPhase("Recheck in " + left + "s"); return; }
        clearInterval(t);
        setPhase("Check two running…");
        Promise.all(C.AGENTS.map(function (a) { return C.checkOnce(a.id); })).then(function (seconds) {
          var now = new Date().toISOString();
          C.AGENTS.forEach(function (a, i) {
            var st = state[a.id];
            st.second = seconds[i];
            st.state = C.combine(st.first, st.second);
            st.history.push({ state: st.state, at: now });
            if (C.isFlapping(st.history)) st.state = "flapping";
          });
          render();
          setPhase("Checked " + central(now, true));
          running = false;
          btn.disabled = false;
        });
      }, 1000);
    });
  }

  function loadAction() {
    fetch("results.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (r) {
        document.getElementById("action").textContent = "GitHub Action last verdict: " +
          C.LOOK[r.overall].icon + " " + C.LOOK[r.overall].label + " at " + central(r.checked_at, true);
      })
      .catch(function () {
        document.getElementById("action").textContent = "GitHub Action: no results.json yet";
      });
  }

  function setAuto(on) {
    clearInterval(autoTimer);
    autoTimer = on ? setInterval(function () { runCheck(); loadAction(); }, 10 * 60 * 1000) : null;
  }

  document.getElementById("recheck").addEventListener("click", runCheck);
  document.getElementById("auto").addEventListener("change", function (e) { setAuto(e.target.checked); });
  render();
  runCheck();
  loadAction();
  setAuto(true);
</script>
</body>
</html>
